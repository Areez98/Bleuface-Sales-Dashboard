<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bleuface • Live B2B Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<style>
  :root{--bleu:#00C0FF;--bleu-dark:#007AA8;--ink:#0B1220;--soft:#F2FBFF;}
  html,body{font-family:'Inter',sans-serif;background:#F7FAFC;color:var(--ink);scroll-behavior:smooth;}
  .brand-grad{background:linear-gradient(135deg,#00C0FF 0%,#007AA8 100%);}
  .kpi-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px;}
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:700;}
  .kpi-value{font-size:24px;font-weight:800;color:var(--ink);margin-top:4px;}
  .panel{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px;margin-bottom:24px;}
  .tbl{width:100%;font-size:13px;border-collapse:collapse;}
  .tbl thead th{background:#F8FAFC;text-align:left;padding:12px;border-bottom:2px solid #E2E8F0;font-weight:700;}
  .tbl tbody td{padding:12px;border-bottom:1px solid #F1F5F9;}
  .pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;}
  .pill-paid{background:#DCFCE7;color:#166534;}
  .pill-unpaid{background:#FEE2E2;color:#991B1B;}
  #loader{position:fixed;inset:0;background:white;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99;}
  .spinner{width:40px;height:40px;border:4px solid #F3F4F6;border-top:4px solid #00C0FF;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p class="mt-4 font-bold text-gray-500">Syncing Bleuface Data...</p>
</div>

<header class="brand-grad text-white px-8 py-10">
  <div class="max-w-7xl mx-auto flex justify-between items-end">
    <div>
      <p class="text-xs font-bold tracking-widest uppercase opacity-80">Bleuface Business</p>
      <h1 class="text-4xl font-black mt-1">B2B Sales Dashboard</h1>
    </div>
    <div class="text-right"><p id="last-update" class="text-sm opacity-80">Syncing...</p></div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-8">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
    <div class="kpi-card"><div class="kpi-label">Total Net Revenue</div><div class="kpi-value" id="kpi-net">Rs 0</div></div>
    <div class="kpi-card"><div class="kpi-label">Total Units Sold</div><div class="kpi-value" id="kpi-units">0</div></div>
    <div class="kpi-card"><div class="kpi-label">Total Orders</div><div class="kpi-value" id="kpi-orders">0</div></div>
    <div class="kpi-card"><div class="kpi-label">Unpaid Invoices</div><div class="kpi-value text-red-500" id="kpi-unpaid">0</div></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <div class="panel">
        <h3 class="font-bold text-gray-700 mb-4">Revenue Trend (Monthly Net)</h3>
        <canvas id="mainChart" height="140"></canvas>
      </div>
      <div class="panel">
        <h3 class="font-bold text-gray-700 mb-4">Latest Invoices</h3>
        <div class="overflow-x-auto">
          <table class="tbl" id="invoice-table">
            <thead><tr><th>Ref</th><th>Customer</th><th>Net Amount</th><th>Status</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="lg:col-span-1">
      <div class="panel"><h3 class="font-bold text-gray-700 mb-4">Top 5 Products (by Value)</h3><div id="top-products" class="space-y-4"></div></div>
      <div class="panel"><h3 class="font-bold text-gray-700 mb-4">Top Customers</h3><div id="top-customers" class="space-y-4"></div></div>
    </div>
  </div>
</main>

<script>
const ORDERS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUduhmiM_Ee50NL3Uo87q5mjASEff8wR7JMuxuh2NuvewjNUslqa0E7u-VL0edCZ4XANJyZty89wHz/pub?gid=848015419&single=true&output=csv";
const INVOICES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUduhmiM_Ee50NL3Uo87q5mjASEff8wR7JMuxuh2NuvewjNUslqa0E7u-VL0edCZ4XANJyZty89wHz/pub?gid=1850157841&single=true&output=csv";

async function init() {
  const fetchCSV = (url) => new Promise(res => Papa.parse(url, {download:true, header:true, dynamicTyping:true, complete:res}));
  const [ordersRes, invoicesRes] = await Promise.all([fetchCSV(ORDERS_URL), fetchCSV(INVOICES_URL)]);
  render(ordersRes.data, invoicesRes.data);
}

function render(orders, invoices) {
  let net=0, units=0, ords=0, unpaidCount=0;
  let skus={}, custs={}, monthly={};

  orders.forEach(r => {
    if(!r['Order Date']) return;
    const val = r['Line Net'] || 0;
    net += val;
    units += (r['Quantity'] || 0);
    const m = r['Order Date'].substring(0, 7);
    monthly[m] = (monthly[m] || 0) + val;
    skus[r['Product']] = (skus[r['Product']] || 0) + val;
    custs[r['Customer']] = (custs[r['Customer']] || 0) + val;
  });

  const uniqueOrders = new Set(orders.map(r => r['Order Ref'])).size;
  invoices.forEach(inv => { if(inv['Paid?'] === false || inv['Paid?'] === 'FALSE') unpaidCount++; });

  document.getElementById('kpi-net').innerText = 'Rs ' + Math.round(net).toLocaleString();
  document.getElementById('kpi-units').innerText = units.toLocaleString();
  document.getElementById('kpi-orders').innerText = uniqueOrders;
  document.getElementById('kpi-unpaid').innerText = unpaidCount;
  document.getElementById('last-update').innerText = 'Last Sync: ' + new Date().toLocaleTimeString();

  // Charts & Tables
  const sortedSkus = Object.entries(skus).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('top-products').innerHTML = sortedSkus.map(([n,v])=>`<div class="flex justify-between text-sm"><span>${n}</span><b>Rs ${Math.round(v).toLocaleString()}</b></div>`).join('');
  
  const sortedCusts = Object.entries(custs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('top-customers').innerHTML = sortedCusts.map(([n,v])=>`<div class="flex justify-between text-sm"><span>${n}</span><b>Rs ${Math.round(v).toLocaleString()}</b></div>`).join('');

  const tableBody = document.querySelector('#invoice-table tbody');
  tableBody.innerHTML = invoices.slice(0,10).map(inv => `<tr><td>${inv['Order Ref']}</td><td>${inv['Customer']}</td><td>Rs ${Math.round(inv['Net (PKR)']).toLocaleString()}</td><td><span class="pill ${inv['Paid?']===true||inv['Paid?']==='TRUE'?'pill-paid':'pill-unpaid'}">${inv['Paid?']===true||inv['Paid?']==='TRUE'?'Paid':'Pending'}</span></td></tr>`).join('');

  const mKeys = Object.keys(monthly).sort();
  new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels: mKeys, datasets: [{ label: 'Net Revenue', data: mKeys.map(k=>monthly[k]), backgroundColor: '#00C0FF', borderRadius: 4 }] },
    options: { plugins: { legend: { display: false } } }
  });

  document.getElementById('loader').style.display = 'none';
}
init();
</script>
</body>
</html>
