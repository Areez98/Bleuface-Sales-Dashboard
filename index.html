<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bleuface • Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<style>
  :root{--bleu:#00C0FF;--ink:#0B1220;}
  html,body{font-family:'Inter',sans-serif;background:#F8FAFC;color:var(--ink);}
  .brand-grad{background:linear-gradient(135deg,#00C0FF 0%,#007AA8 100%);}
  .kpi-card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:20px;}
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:700;}
  .kpi-value{font-size:26px;font-weight:900;margin-top:4px;}
  .panel{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:24px;margin-bottom:24px;}
  .pill{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;}
  .pill-paid{background:#DCFCE7;color:#166534;}
  .pill-unpaid{background:#FEE2E2;color:#991B1B;}
  #loader{position:fixed;inset:0;background:white;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99;}
</style>
</head>
<body>

<div id="loader"><p class="font-black text-blue-500 animate-pulse">CLEANING DATA...</p></div>

<header class="brand-grad text-white px-8 py-12">
  <div class="max-w-7xl mx-auto">
    <p class="text-xs font-bold tracking-[0.3em] uppercase opacity-70">Bleuface Operations</p>
    <h1 class="text-5xl font-black mt-2 tracking-tight">Business Intelligence</h1>
  </div>
</header>

<main class="max-w-7xl mx-auto p-8 -mt-8">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="kpi-card"><div class="kpi-label">Net Sales</div><div class="kpi-value" id="kpi-net">Rs 0</div></div>
    <div class="kpi-card"><div class="kpi-label">Est. Profit</div><div class="kpi-value text-green-600" id="kpi-profit">Rs 0</div></div>
    <div class="kpi-card"><div class="kpi-label">Units Sold</div><div class="kpi-value" id="kpi-units">0</div></div>
    <div class="kpi-card"><div class="kpi-label">Unpaid</div><div class="kpi-value text-red-500" id="kpi-unpaid">Rs 0</div></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2">
      <div class="panel"><canvas id="mainChart" height="120"></canvas></div>
      <div class="panel">
        <h3 class="font-bold mb-4">Latest Invoices</h3>
        <table class="w-full text-sm" id="invoice-table">
          <thead class="text-left border-b-2"><tr><th class="pb-2">Ref</th><th class="pb-2">Partner</th><th class="pb-2">Net</th><th class="pb-2">Status</th></tr></thead>
          <tbody class="divide-y"></tbody>
        </table>
      </div>
    </div>
    <div class="lg:col-span-1">
        <div class="panel">
            <h3 class="font-bold mb-4">Top Products</h3>
            <div id="top-products" class="space-y-4"></div>
        </div>
    </div>
  </div>
</main>

<script>
const URLS = {
  orders: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUduhmiM_Ee50NL3Uo87q5mjASEff8wR7JMuxuh2NuvewjNUslqa0E7u-VL0edCZ4XANJyZty89wHz/pub?gid=848015419&single=true&output=csv",
  invoices: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUduhmiM_Ee50NL3Uo87q5mjASEff8wR7JMuxuh2NuvewjNUslqa0E7u-VL0edCZ4XANJyZty89wHz/pub?gid=1850157841&single=true&output=csv",
  products: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUduhmiM_Ee50NL3Uo87q5mjASEff8wR7JMuxuh2NuvewjNUslqa0E7u-VL0edCZ4XANJyZty89wHz/pub?gid=1615991162&single=true&output=csv"
};

// Helper to turn "Rs 1,200" into 1200
function clean(val) {
  if (val === null || val === undefined) return 0;
  const str = String(val).replace(/[^\d.-]/g, '');
  const num = parseFloat(str);
  return isNaN(num) ? 0 : num;
}

async function init() {
  const fetchCSV = (u) => new Promise(res => Papa.parse(u, {download:true, header:true, complete:res}));
  const data = await Promise.all(Object.values(URLS).map(fetchCSV));
  render(data[0].data, data[1].data, data[2].data);
}

function render(orders, invoices, products) {
  let net=0, units=0, profit=0, unpaid=0;
  let skuSales={}, skuQty={}, monthly={};
  
  const productInfo = {};
  products.forEach(p => { productInfo[p['Product']] = clean(p['Unit Cost (PKR)']); });

  orders.forEach(r => {
    if(!r['Order Date'] || !r['Product']) return;
    const lineNet = clean(r['Line Net']);
    const qty = clean(r['Quantity']);
    const cost = (productInfo[r['Product']] || 0) * qty;

    net += lineNet;
    units += qty;
    profit += (lineNet - cost);

    const m = String(r['Order Date']).substring(0, 7);
    monthly[m] = (monthly[m] || 0) + lineNet;
    skuSales[r['Product']] = (skuSales[r['Product']] || 0) + lineNet;
    skuQty[r['Product']] = (skuQty[r['Product']] || 0) + qty;
  });

  invoices.forEach(inv => {
    const isPaid = String(inv['Paid?']).toUpperCase() === 'TRUE';
    if(!isPaid && inv['Net (PKR)']) unpaid += clean(inv['Net (PKR)']);
  });

  document.getElementById('kpi-net').innerText = 'Rs ' + Math.round(net).toLocaleString();
  document.getElementById('kpi-profit').innerText = 'Rs ' + Math.round(profit).toLocaleString();
  document.getElementById('kpi-units').innerText = Math.round(units).toLocaleString();
  document.getElementById('kpi-unpaid').innerText = 'Rs ' + Math.round(unpaid).toLocaleString();

  const sortedSkus = Object.entries(skuSales).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('top-products').innerHTML = sortedSkus.map(([n,v])=>`
    <div class="flex justify-between text-sm border-b pb-2">
      <span class="font-medium">${n}</span>
      <span class="font-bold">Rs ${Math.round(v).toLocaleString()}</span>
    </div>
  `).join('');

  const tableBody = document.querySelector('#invoice-table tbody');
  tableBody.innerHTML = invoices.filter(i=>i['Order Ref']).slice(0,8).map(inv => `
    <tr class="py-2">
      <td class="py-3 font-mono text-gray-400">${inv['Order Ref']}</td>
      <td>${inv['Customer']}</td>
      <td class="font-bold">Rs ${Math.round(clean(inv['Net (PKR)'])).toLocaleString()}</td>
      <td><span class="pill ${String(inv['Paid?']).toUpperCase()==='TRUE'?'pill-paid':'pill-unpaid'}">
        ${String(inv['Paid?']).toUpperCase()==='TRUE'?'Paid':'Pending'}
      </span></td>
    </tr>
  `).join('');

  const mKeys = Object.keys(monthly).sort();
  new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels: mKeys, datasets: [{ label: 'Revenue', data: mKeys.map(k=>monthly[k]), backgroundColor: '#00C0FF', borderRadius: 4 }] },
    options: { plugins: { legend: { display: false } } }
  });

  document.getElementById('loader').style.display = 'none';
}
init();
</script>
</body>
</html>
